name: Train Oracle
"on":
  workflow_dispatch:
    inputs:
      top:
        description: Top N symbols
        default: "50"
      fast:
        description: fast debug run
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * 1"   # 每周一 UTC04:00 自动重训
  push:
    paths: ["train.py", "features.py", "binance_data.py"]
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          pip install --quiet numpy==1.26.4 "pandas>=2.2,<3" \
            scikit-learn==1.3.2 joblib requests pyarrow==14.0.2
      - name: train
        run: |
          FAST=""
          if [ "${{ inputs.fast }}" = "true" ]; then FAST="--fast"; fi
          python train.py --top "${{ inputs.top || '50' }}" --years 2 $FAST
      - name: summary
        if: always()
        run: |
          echo "## Metrics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -25 metrics.csv >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "no metrics yet" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat meta.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-models
          path: |
            models/
            metrics.csv
            meta.json
          retention-days: 30

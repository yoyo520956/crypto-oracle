<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>加密神谕 · Oracle Live</title>
<style>
:root{--bg:#0b0e13;--card:#131822;--tx:#dfe6f0;--dim:#5c6b82;--up:#2fd683;--dn:#ff5d6c;--mid:#39435a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:13px/1.5 "SF Mono",Menlo,monospace;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 12px}
h1{font-size:15px;letter-spacing:2px}
h1 b{color:var(--up)}
#stat{color:var(--dim);font-size:11px}
#stat i{color:var(--up);font-style:normal}
table{width:100%;border-collapse:collapse}
th{color:var(--dim);font-size:10px;text-align:right;padding:4px 6px;border-bottom:1px solid var(--mid)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 6px;text-align:right;border-bottom:1px solid #1a2130;font-size:12px}
tr.hot{background:#141c2b}
.sym{color:#9fb4d8;font-weight:700}
.badge{display:inline-block;min-width:52px;text-align:center;padding:2px 6px;border-radius:4px;font-weight:700}
.b-up{background:rgba(47,214,131,.15);color:var(--up)}
.b-dn{background:rgba(255,93,108,.15);color:var(--dn)}
.b-n{background:#1a2130;color:var(--dim)}
.c-up{color:var(--up)}.c-dn{color:var(--dn)}.c-dim{color:var(--dim)}
.bar{height:4px;border-radius:2px;background:var(--mid);position:relative;width:70px;display:inline-block;vertical-align:middle}
.bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.foot{color:var(--dim);font-size:10px;padding:12px 4px}
</style>
</head>
<body>
<header>
  <h1>⛩️ 加密<b>神谕</b> ORACLE LIVE</h1>
  <div id="stat">连接中…</div>
</header>
<table>
<thead><tr><th>币种</th><th>价格</th><th>↑5分钟概率</th><th>秒级(4s)</th><th>1m</th><th>5m</th><th>1h</th></tr></thead>
<tbody id="tb"></tbody>
</table>
<div class="foot">模型=统计倾向参考，非投资建议 · 数据源 data-api.binance.vision · 每秒刷新</div>
<script>
const fmtP=(p)=>{if(p==null)return'-';
 const v=(p*100).toFixed(1)+'%';
 const cls=p>0.55?'b-up':p<0.45?'b-dn':'b-n';
 const w=Math.round(Math.abs(p-0.5)*140);
 const col=p>=0.5?'var(--up)':'var(--dn)';
 const off=p>=0.5?'50%':(50-w)+'%';
 return `<span class="badge ${cls}">${v}</span> <span class="bar"><i style="left:${off};width:${w}%;background:${col}"></i></span>`};
const chg=(c,k)=>{if(!c||c[k]==null)return'<span class="c-dim">-</span>';
 const v=c[k]*100;return `<span class="${v>=0?'c-up':'c-dn'}">${v>=0?'+':''}${v.toFixed(2)}%</span>`};
const fmtPx=(x)=>x>=1000?x.toFixed(1):x>=1?x.toFixed(3):x.toPrecision(5);
async function tick(){
 try{
  const d=await fetch('/api/state').then(x=>x.json());
  const rows=Object.entries(d.preds||{}).map(([s,v])=>[s,v]);
  rows.sort((a,b)=>Math.abs((b[1].p_1m||.5)-.5)-Math.abs((a[1].p_1m||.5)-.5));
  document.getElementById('stat').innerHTML=
   `tick <i>${d.tick}</i> · 币数 <i>${rows.length}</i> · ${new Date().toLocaleTimeString()}`;
  document.getElementById('tb').innerHTML=rows.map(([s,v])=>
   `<tr class="${Math.abs((v.p_1m||.5)-.5)>0.08?'hot':''}">
     <td class="sym">${s.replace('USDT','')}</td>
     <td>${fmtPx(v.price)}</td>
     <td>${fmtP(v.p_1m)}</td>
     <td>${fmtP(v.p_1s)}</td>
     <td>${chg(v.chg,'1m')}</td><td>${chg(v.chg,'5m')}</td><td>${chg(v.chg,'1h')}</td>
   </tr>`).join('');
 }catch(e){document.getElementById('stat').textContent='服务未响应…'}
}
setInterval(tick,1000);tick();
</script>
</body>
</html>
